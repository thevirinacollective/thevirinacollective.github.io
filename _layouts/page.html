---
layout: default
---
<section class="band-blush" style="padding: 72px 0 56px;">
  <div class="narrow">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 style="font-size: clamp(34px, 5vw, 48px); line-height: 1.1; margin-bottom: 16px;">{{ page.heading | default: page.title }}</h1>
    {% if page.updated %}<p style="font-size: 15px; color: var(--muted);">Last updated: {{ page.updated }}</p>{% endif %}
  </div>
</section>

<section class="band-white" style="padding: 56px 0 96px;">
  <div class="narrow prose">
{{ content }}
  </div>
</section>
